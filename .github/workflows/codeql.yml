name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

# Mínimo privilegio: denegar todo por defecto.
permissions: {}

jobs:
  analyze:
    name: Analizar código JavaScript
    runs-on: ubuntu-latest
    permissions:
      contents: read          # leer el código a analizar
      actions: read           # requerido por CodeQL en PRs
      security-events: write  # único permiso de escritura: publicar hallazgos en Security
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Analizar
        uses: github/codeql-action/analyze@v3