<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATELIER — ERP para Tienda de Ropa</title>
  <link rel="stylesheet" href="src/css/styles.css">
</head>
<body>

  <!-- ============ LOGIN ============ -->
  <!-- El formulario vive en una etiqueta colgante de prenda: el cordón baja
       desde el borde superior hasta el ojal de la etiqueta. -->
  <section id="login" class="login" hidden>
    <div class="login-brand">
      <h1>atelier</h1>
      <p>Inventario, ventas y compras de la tienda en un solo lugar.</p>
    </div>

    <div class="tag-hanger">
      <span class="tag-string" aria-hidden="true"></span>
      <form id="login-form" class="tag" novalidate>
        <span class="tag-hole" aria-hidden="true"></span>
        <div class="tag-body">
          <h2>Inicia sesión</h2>
          <p class="sub">Usa el correo y la contraseña de tu cuenta.</p>

          <div class="field">
            <label for="correo">Correo</label>
            <input id="correo" name="correo" type="email" autocomplete="username"
                   placeholder="nombre@atelier.com" required aria-describedby="correo-error">
            <div class="field-error" id="correo-error" role="alert"></div>
          </div>

          <div class="field">
            <label for="contrasena">Contraseña</label>
            <div class="pass-wrap">
              <input id="contrasena" name="contrasena" type="password" autocomplete="current-password"
                     placeholder="Mínimo 6 caracteres" required minlength="6" aria-describedby="contrasena-error">
              <button type="button" class="pass-toggle" id="pass-toggle" aria-controls="contrasena" aria-pressed="false">Mostrar</button>
            </div>
            <div class="field-error" id="contrasena-error" role="alert"></div>
          </div>

          <div class="form-error" id="login-error" role="alert"></div>
          <button type="submit" class="btn btn-block">Ingresar</button>
        </div>

        <!-- Talón desprendible de la etiqueta: información secundaria -->
        <div class="tag-stub">
          <p>Cuentas de prueba, todas con la contraseña <b>123456</b>:</p>
          <ul>
            <li><button type="button" data-demo="admin@atelier.com">admin@atelier.com</button></li>
            <li><button type="button" data-demo="vendedor@atelier.com">vendedor@atelier.com</button></li>
            <li><button type="button" data-demo="cliente@atelier.com">cliente@atelier.com</button></li>
          </ul>
        </div>
      </form>
    </div>
  </section>

  <!-- ============ APP SHELL ============ -->
  <section id="app" class="app" hidden>
    <header class="mobile-bar">
      <button id="menu-btn" class="menu-btn" aria-label="Abrir menú" aria-controls="sidebar" aria-expanded="false">Menú</button>
      <span class="logo">atelier</span>
      <a href="#/inventario" class="bell-mini" id="bell-mini" title="Variantes por reponer"><b>0</b> por reponer</a>
    </header>

    <aside id="sidebar" class="sidebar">
      <div class="logo">atelier</div>
      <nav id="nav" aria-label="Navegación principal"></nav>
      <div class="user-box">
        <b id="user-name">—</b>
        <span class="role" id="user-role">—</span>
        <button id="logout-btn" class="link-btn" type="button">Cerrar sesión</button>
      </div>
    </aside>
    <div id="backdrop" class="backdrop" hidden></div>

    <main id="main">
      <div class="topbar">
        <h2 id="view-title">Inicio</h2>
        <div class="meta">
          <span id="data-source" class="pill pill-muted">—</span>
          <a href="#/inventario" id="bell" class="bell"><b id="low-count">0</b> variantes por reponer</a>
        </div>
      </div>
      <div id="screen" aria-live="polite"></div>
    </main>
  </section>

  <div id="toast" role="status"></div>

  <!-- Scripts clásicos (sin build): funciona abriendo el archivo o servido por Express -->
  <script src="src/js/utils.js"></script>
  <script src="src/js/data.js"></script>
  <script src="src/js/api.js"></script>
  <script src="src/js/views/login.js"></script>
  <script src="src/js/views/dashboard.js"></script>
  <script src="src/js/views/pos.js"></script>
  <script src="src/js/views/inventario.js"></script>
  <script src="src/js/views/catalogo.js"></script>
  <script src="src/js/views/compras.js"></script>
  <script src="src/js/app.js"></script>
</body>
</html>
