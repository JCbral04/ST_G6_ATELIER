<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ATELIER | Reposición inteligente</title><style>
body{font:16px system-ui;margin:0;background:#f7f6fa;color:#222}main{max-width:1100px;margin:32px auto;padding:0 20px}h1{color:#6323a6}section{background:white;border:1px solid #ddd;border-radius:10px;padding:20px;margin:18px 0}input,button{font:inherit;padding:8px;margin:5px;border:1px solid #888;border-radius:5px}button{background:#6323a6;color:white;cursor:pointer}button:disabled{opacity:.5}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #ddd;text-align:left}th{font-size:13px}small{color:#555}.table{overflow:auto}#notice{white-space:pre-line}a{color:#6323a6}</style></head><body><main><a href="/">Volver al ERP</a><h1>Reposición inteligente de inventario</h1><p>ATELIER · Panel de decisión para el administrador</p><section id="access"><form id="login"><label>Correo <input id="correo" type="email" required autocomplete="username"></label><label>Contraseña <input id="pass" type="password" required autocomplete="current-password"></label><button>Autenticar</button></form></section><section id="analysis" hidden><form id="run"><label>Horizonte (días) <input id="horizon" type="number" value="15" min="1" max="30" required></label><label>Entrega (días, supuesto) <input id="lead" type="number" value="7" min="1" max="30" required></label><button id="go">Analizar inventario</button><button type="button" id="logout">Cerrar sesión</button></form><p><small>Las sugerencias no crean compras automáticamente. El administrador decide qué solicitar.</small></p><div class="table"><table><thead><tr><th>SKU</th><th>Producto</th><th>Stock</th><th>Tránsito</th><th>Modelo</th><th>Demanda/día</th><th>Cobertura</th><th>Riesgo</th><th>Compra sugerida</th></tr></thead><tbody id="items"></tbody></table></div></section><p role="status" id="notice"></p></main><script src="ia.js" defer></script></body></html>
